<script>
// Variables globales pour la galerie terrasse
let itemsterrasse = [
  {
    src: 'https://lh3.googleusercontent.com/d/11cqvxSzlHrstAx1wKSenUqBKrcNqQtxa',
    caption: 'Preparation du cadre support',
    isVideo: false
  },
  {
    src: 'https://lh3.googleusercontent.com/d/1il07g5maZR56r5_bTq-vzYlzpTgTCSHg',
    caption: 'Autre vue du cadre en bois',
    isVideo: false
  },
  {
    src: 'https://lh3.googleusercontent.com/d/1eJeC9Z2DseqUgRBuzJ8eqalfMsEktxFD',
    caption: 'Lames coupées et posées',
    isVideo: false
  }
];

let currentIndexterrasse = 0;
let zoomScaleterrasse = 1;
let translateXterrasse = 0;
let translateYterrasse = 0;
let isDraggingterrasse = false;
let startXterrasse = 0;
let startYterrasse = 0;
let lastTranslateXterrasse = 0;
let lastTranslateYterrasse = 0;

function openMediaterrasse(index) {
  currentIndexterrasse = index;
  const item = itemsterrasse[index];
  const img = document.getElementById('mImgterrasse');
  const vid = document.getElementById('mVidterrasse');
  const modal = document.getElementById('mediaModalterrasse');
  
  if (item.isVideo) {
    img.style.display = 'none';
    vid.style.display = 'block';
    document.getElementById('mVidSrcterrasse').src = item.src;
    vid.load();
    vid.play().catch(e => console.log('Autoplay prevented:', e));
  } else {
    vid.style.display = 'none';
    img.style.display = 'block';
    img.src = item.src;
    img.style.transform = 'scale(1) translate(0px, 0px)';
    img.style.cursor = 'zoom-in';
    zoomScaleterrasse = 1;
    translateXterrasse = 0;
    translateYterrasse = 0;
    lastTranslateXterrasse = 0;
    lastTranslateYterrasse = 0;
  }
  
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';



}

function closeMediaterrasse() {
  const vid = document.getElementById('mVidterrasse');
  const modal = document.getElementById('mediaModalterrasse');
  vid.pause();
  vid.currentTime = 0;
  modal.classList.remove('active');
  document.body.style.overflow = 'auto';
}


function prevMediaterrasse() {
  const vid = document.getElementById('mVidterrasse');
  vid.pause();
  vid.currentTime = 0;
  currentIndexterrasse = (currentIndexterrasse - 1 + itemsterrasse.length) % itemsterrasse.length;
  openMediaterrasse(currentIndexterrasse);
}

function nextMediaterrasse() {

  const vid = document.getElementById('mVidterrasse');
  vid.pause();
  vid.currentTime = 0;
  currentIndexterrasse = (currentIndexterrasse + 1) % itemsterrasse.length;
  openMediaterrasse(currentIndexterrasse);
}

function toggleFullscreenterrasse() {
  const modalContent = document.getElementById('modalContentterrasse');
  if (!document.fullscreenElement) {
    modalContent.requestFullscreen().catch(err => console.log('Fullscreen error:', err));
  } else {
    document.exitFullscreen();
  }
}

function exitFullscreenterrasse() {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  }
}



// Gestion de la visibilité des croix selon le mode plein écran
document.addEventListener('fullscreenchange', function() {
  const normalCloseBtn = document.querySelector('.modal-close');
  const fullscreenCloseBtn = document.getElementById('fullscreenCloseBtnterrasse');
  
  if (document.fullscreenElement) {
    // En plein écran : masquer la croix normale, afficher la croix plein écran
    if (normalCloseBtn) {
      normalCloseBtn.style.display = 'none';
    }
    if (fullscreenCloseBtn) {
      fullscreenCloseBtn.style.display = 'flex';
    }
  } else {
    // Hors plein écran : afficher la croix normale, masquer la croix plein écran
    if (normalCloseBtn) {
      normalCloseBtn.style.display = 'flex';
    }
    if (fullscreenCloseBtn) {
      fullscreenCloseBtn.style.display = 'none';
    }
  }
});

// Gestion clavier
document.addEventListener('keydown', function(e) {
  const modal = document.getElementById('mediaModalterrasse');
  if (modal.classList.contains('active')) {
    if (e.key === 'ArrowLeft') prevMediaterrasse();
    else if (e.key === 'ArrowRight') nextMediaterrasse();
    else if (e.key === 'Escape') closeMediaterrasse();
  }
});

// Gestion du clic sur le modal pour fermer
document.getElementById('mediaModalterrasse').addEventListener('click', function(e) {
  if (e.target === this) closeMediaterrasse();
});

// Zoom et pan pour les images
document.getElementById('mImgterrasse').addEventListener('click', function(e) {
  e.stopPropagation();
  if (this.style.display === 'block') {
    zoomScaleterrasse = zoomScaleterrasse === 1 ? 2 : 1;
    if (zoomScaleterrasse === 1) {
      translateXterrasse = translateYterrasse = 0;
      lastTranslateXterrasse = lastTranslateYterrasse = 0;
      this.style.cursor = 'zoom-in';
    } else {
      this.style.cursor = 'grab';
    }
    this.style.transform = 'scale(' + zoomScaleterrasse + ') translate(' + translateXterrasse + 'px, ' + translateYterrasse + 'px)';
  }
});

document.getElementById('mImgterrasse').addEventListener('wheel', function(e) {
  e.preventDefault();
  e.stopPropagation();
  
  if (this.style.display === 'block') {
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    zoomScaleterrasse *= delta;
    zoomScaleterrasse = Math.max(0.5, Math.min(zoomScaleterrasse, 5));
    
    if (zoomScaleterrasse === 1) {
      translateXterrasse = translateYterrasse = 0;
      lastTranslateXterrasse = lastTranslateYterrasse = 0;
      this.style.cursor = 'zoom-in';
    } else {
      this.style.cursor = 'grab';
    }
    
    this.style.transform = 'scale(' + zoomScaleterrasse + ') translate(' + translateXterrasse + 'px, ' + translateYterrasse + 'px)';
  }
});

document.getElementById('mImgterrasse').addEventListener('mousedown', function(e) {
  if (this.style.display === 'block' && zoomScaleterrasse > 1) {
    e.preventDefault();
    isDraggingterrasse = true;
    this.classList.add('dragging');
    this.style.cursor = 'grabbing';
    startXterrasse = e.clientX - lastTranslateXterrasse;
    startYterrasse = e.clientY - lastTranslateYterrasse;
  }
});

document.addEventListener('mousemove', function(e) {
  if (isDraggingterrasse) {
    e.preventDefault();
    translateXterrasse = (e.clientX - startXterrasse);
    translateYterrasse = (e.clientY - startYterrasse);
    
    const img = document.getElementById('mImgterrasse');
    img.style.transform = 'scale(' + zoomScaleterrasse + ') translate(' + translateXterrasse + 'px, ' + translateYterrasse + 'px)';
  }
});

document.addEventListener('mouseup', function(e) {
  if (isDraggingterrasse) {
    isDraggingterrasse = false;
    const img = document.getElementById('mImgterrasse');
    img.classList.remove('dragging');
    img.style.cursor = zoomScaleterrasse > 1 ? 'grab' : 'zoom-in';
    lastTranslateXterrasse = translateXterrasse;
    lastTranslateYterrasse = translateYterrasse;
  }
});
</script>
